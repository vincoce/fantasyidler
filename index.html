<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lanternfall</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏮</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: dark;
  --sea: #1C2433; --sea2: #243049; --panel: #1F2838; --panel2: #283347;
  --ink: #DCE0E6; --muted: #9AA6B6; --line: #3A475E;
  --gilt: #D2AE52; --gilt-soft: #8C7740; --moss: #7F9468; --lichen: #A9B78F;
  --blood: #C2525F; --heal: #7FC48A; --frost: #8FB6D9;
  --display: "IM Fell English SC", "IM Fell English", Georgia, serif;
  --serif: "IM Fell English", Georgia, serif;
  --sans: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --sea: #E4E8E1; --sea2: #D5DCD3; --panel: #F2F3EE; --panel2: #E6E9E1;
    --ink: #1E2A38; --muted: #5A6675; --line: #BCC4BA;
    --gilt: #8A6A1C; --gilt-soft: #B49A5A; --moss: #5E7148; --lichen: #7B8C61;
    --blood: #A33A47; --heal: #2F7D3D; --frost: #3C6E99;
  }
}
*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; }
body { margin: 0; min-height: 100%; background: var(--sea); color: var(--ink); font: 17px/1.5 var(--sans); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gilt); outline-offset: 2px; }

.top { display: flex; align-items: baseline; gap: 14px; padding: 12px 18px 6px; flex-wrap: wrap; }
.top h1 { font: 400 34px/1 var(--display); margin: 0; letter-spacing: .01em; color: var(--gilt); }
.top .realm { font: italic 17px var(--serif); color: var(--muted); }
.top .purse { margin-left: auto; display: flex; gap: 16px; align-items: baseline; font-variant-numeric: tabular-nums; }
.top .purse b { color: var(--gilt); font-weight: 700; }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 14px; padding: 0 14px 14px; max-width: 1500px; margin: 0 auto; }
@media (max-width: 980px) { .layout { grid-template-columns: minmax(0, 1fr); padding: 0 8px 10px; gap: 10px; } }

.stage { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.mapwrap { position: relative; border-radius: 6px; overflow: hidden; background: var(--sea2); border: 1px solid var(--line); }
#map { display: block; width: 100%; height: auto; aspect-ratio: 1000 / 640; cursor: pointer; }
@media (max-width: 600px) { .mapnote { display: none; } }
.mapnote { position: absolute; left: 10px; bottom: 8px; font: italic 15px var(--serif); color: var(--ink); background: color-mix(in srgb, var(--sea) 78%, transparent); padding: 2px 10px; border-radius: 3px; pointer-events: none; }
.battlewrap { position: relative; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); background: var(--panel); }
#battle { display: block; width: 100%; height: 230px; }
@media (max-width: 600px) { #battle { height: 200px; } }

.side { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; display: flex; flex-direction: column; min-width: 0; max-height: calc(100vh - 80px); position: sticky; top: 10px; }
@media (max-width: 980px) { .side { max-height: none; position: static; } }
.tabs { display: flex; flex-shrink: 0; border-bottom: 1px solid var(--line); overflow-x: auto; background: var(--panel); border-radius: 6px 6px 0 0; }
@media (max-width: 980px) { .tabs { position: sticky; top: 0; z-index: 5; } }
.tabs button { flex: 1 0 auto; background: none; border: 0; padding: 11px 12px 9px; cursor: pointer; color: var(--muted); font: 400 18px var(--display); border-bottom: 2px solid transparent; position: relative; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--gilt); }
.tabs .dot { position: absolute; top: 8px; right: 5px; width: 7px; height: 7px; border-radius: 50%; background: var(--gilt); }
.pane { padding: 14px 16px 18px; overflow-y: auto; }
.pane h2 { font: 400 23px/1.2 var(--display); margin: 2px 0 10px; color: var(--ink); }
.pane h3 { font: 400 19px/1.2 var(--display); margin: 18px 0 6px; color: var(--gilt); }
.pane p { margin: 6px 0; max-width: 62ch; }
.hint { color: var(--muted); font-size: 15px; }

.hero { padding: 12px 0 14px; border-bottom: 1px solid var(--line); }
.hero:last-child { border-bottom: 0; }
.hero .name { display: flex; align-items: baseline; gap: 8px; }
.hero .name strong { font: 400 21px var(--display); }
.hero .name span { color: var(--muted); }
.hero .name .lvl { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--ink); }
.bar { height: 6px; background: var(--panel2); border-radius: 3px; overflow: hidden; margin: 6px 0; }
.bar i { display: block; height: 100%; background: var(--gilt); }
.bar.red i { background: var(--blood); }
.stats { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: 15px; font-variant-numeric: tabular-nums; }
.stats b { color: var(--ink); font-weight: 500; }
.gear { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: center; margin-top: 8px; font-size: 15px; }
.btn { background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; padding: 5px 12px; cursor: pointer; font-size: 15px; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--gilt-soft); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.gold { background: var(--gilt); color: var(--sea); border-color: var(--gilt); font-weight: 700; }
.talentpick { margin-top: 10px; padding: 10px 12px; border: 1px dashed var(--gilt-soft); border-radius: 5px; }
.talentpick .opts { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
.talentpick .opts .btn { flex: 1; white-space: normal; text-align: left; }
.talents { font: italic 15px var(--serif); color: var(--lichen); margin-top: 6px; }
.toggle { display: flex; gap: 10px; align-items: center; margin: 6px 0; cursor: pointer; }
.toggle input { width: 18px; height: 18px; accent-color: var(--gilt); }
.queued { font-size: 15px; color: var(--muted); border-left: 2px solid var(--gilt-soft); padding: 2px 10px; margin: 8px 0; }

.regions { list-style: none; padding: 0; margin: 0; }
.regions li { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 9px 0; border-bottom: 1px solid var(--line); align-items: center; }
.regions li .rn { font: 400 19px var(--display); }
.regions li .rd { grid-column: 1; color: var(--muted); font-size: 14px; }
.regions li.locked .rn { color: var(--muted); }
.regions li.here .rn { color: var(--gilt); }
.regions li.sel { background: color-mix(in srgb, var(--gilt) 10%, transparent); }
.regions li .btn, .regions li .tag { grid-row: 1 / span 2; grid-column: 2; }
.tag { font-size: 14px; color: var(--muted); }

.event { padding: 10px 0; border-bottom: 1px solid var(--line); }
.event .when { color: var(--muted); font-size: 14px; }
.event strong { font: 400 19px var(--display); }
.event.now strong { color: var(--gilt); }

.log { list-style: none; padding: 0; margin: 0; }
.log li { padding: 7px 0; border-bottom: 1px solid var(--line); font: 16px/1.4 var(--serif); }
.log li time { display: block; font: 13px var(--sans); color: var(--muted); }
.log li.boss { color: var(--gilt); }
.log li.loss { color: var(--blood); }

.members { list-style: none; padding: 0; margin: 0; }
.members li { display: grid; grid-template-columns: 1fr auto; padding: 8px 0; border-bottom: 1px solid var(--line); gap: 2px 10px; align-items: center; }
.members .mn { display: flex; gap: 8px; align-items: center; font-weight: 700; }
.members .sw { width: 12px; height: 12px; border-radius: 2px; display: inline-block; }
.members .md { color: var(--muted); font-size: 14px; grid-column: 1; }
.members .btn { grid-row: 1 / span 2; grid-column: 2; }
.field { display: flex; gap: 8px; margin: 8px 0; }
.field input { flex: 1; min-width: 0; background: var(--sea); border: 1px solid var(--line); color: var(--ink); padding: 7px 10px; border-radius: 4px; font: inherit; }
.raid { border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; margin: 12px 0; background: var(--panel2); }
.raid strong { font: 400 21px var(--display); }
.code { font: 700 18px var(--sans); letter-spacing: .08em; color: var(--gilt); user-select: all; }
.err { color: var(--blood); font-size: 15px; }

.foot { text-align: center; color: var(--muted); font-size: 14px; padding: 4px 10px 18px; }
.foot button { background: none; border: 0; color: var(--gilt); cursor: pointer; text-decoration: underline; font-size: 14px; padding: 0 4px; }

.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--panel2); border: 1px solid var(--gilt-soft); border-radius: 6px; padding: 12px 16px; max-width: min(520px, calc(100vw - 24px)); z-index: 20; box-shadow: 0 6px 24px rgba(0,0,0,.35); }
.toast h4 { margin: 0 0 4px; font: 400 20px var(--display); color: var(--gilt); }
.toast p { margin: 2px 0; }
.toast .btn { margin-top: 8px; }

.veil { position: fixed; inset: 0; background: color-mix(in srgb, var(--sea) 88%, transparent); display: grid; place-items: center; z-index: 30; }
.veil[hidden] { display: none; }
.veil .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 22px 24px; max-width: 460px; width: calc(100vw - 32px); }
.veil h2 { font: 400 26px var(--display); margin: 0 0 8px; color: var(--gilt); }
.veil .choices { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
.veil .choices .btn { text-align: left; padding: 10px 14px; white-space: normal; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header class="top">
  <h1>Lanternfall</h1>
  <span class="realm" id="realm"></span>
  <div class="purse"><span><b id="gold">0</b> gold</span><span id="power"></span></div>
</header>

<main class="layout">
  <section class="stage">
    <div class="mapwrap"><canvas id="map" width="1000" height="640" aria-label="World map"></canvas><div class="mapnote" id="mapnote"></div></div>
    <div class="battlewrap"><canvas id="battle" aria-label="Current fight"></canvas></div>
  </section>
  <aside class="side">
    <nav class="tabs" role="tablist" id="tabs">
      <button role="tab" data-tab="party" aria-selected="true">Party</button>
      <button role="tab" data-tab="realm">Realm</button>
      <button role="tab" data-tab="events">Events</button>
      <button role="tab" data-tab="guild">Guild</button>
      <button role="tab" data-tab="chronicle">Chronicle</button>
    </nav>
    <div class="pane" id="pane" role="tabpanel"></div>
  </aside>
</main>
<footer class="foot" id="foot"></footer>

<div class="veil" id="busy" hidden><div class="card"><h2>Catching up</h2><p id="busytext">The party's adventures are being written down…</p></div></div>
<div class="veil" id="choice" hidden><div class="card" id="choicecard"></div></div>

<script>
// ===== Lanternfall simulation core =====
// Everything here is deterministic: only + - * / Math.floor Math.imul and bit ops.
// No Math.pow/exp/log/sin, because those can differ between phone and PC browsers.
const SIM = (() => {
  const MIN = 60000, HOUR = 3600000, DAY = 86400000, WEEK = 7 * DAY;
  const WEEK0 = 345600000; // Monday 1970-01-05 00:00 UTC
  const TRAVEL = 25000, REST = 150000;

  function rng(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function hash(...xs) {
    let h = 2166136261 >>> 0;
    for (const x of xs) {
      const s = String(x);
      for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
      h ^= 31; h = Math.imul(h, 16777619) >>> 0;
    }
    return h >>> 0;
  }
  function table(start, mul, n) { const t = [start]; for (let i = 1; i <= n; i++) t.push(t[i - 1] * mul); return t; }
  const G = table(1, 1.07, 500);        // hero & foe stat growth per level
  const XPR = table(20, 1.165, 500);  // xp needed for next level
  const GOLD = table(2, 1.07, 500);
  const XPF = table(2, 1.07, 500);
  const COST = table(25, 1.42, 200);    // gear tier n -> n+1

  const CLASSES = {
    warrior: { name: "Warrior", hp: 140, atk: 10, def: 10, spd: 9, glyph: "⚔" },
    cleric:  { name: "Cleric",  hp: 90,  atk: 7,  def: 6,  spd: 10, glyph: "✚" },
    ranger:  { name: "Ranger",  hp: 85,  atk: 14, def: 4,  spd: 12, glyph: "➶" },
    mage:    { name: "Mage",    hp: 75,  atk: 12, def: 3,  spd: 10, glyph: "✦" },
  };
  const ORDER = ["warrior", "cleric", "ranger", "mage"];
  const NAMES = {
    warrior: ["Brannoc", "Halvard", "Iselde", "Torvin", "Maelis", "Odrun"],
    cleric:  ["Sister Ewa", "Brother Aldo", "Lioren", "Mother Hild", "Caspian", "Nell"],
    ranger:  ["Fenna", "Rook", "Sylas", "Wren", "Arvid", "Kestrel"],
    mage:    ["Ysolde", "Magnar", "Orrin", "Tamsin", "Velka", "Corvin"],
  };
  const TALENTS = {
    warrior: [[{ n: "Iron hide", hp: 15 }, { n: "Bloodied edge", atk: 12 }],
              [{ n: "Shield wall", def: 25 }, { n: "War cry", spd: 8 }],
              [{ n: "Bulwark", hp: 18 }, { n: "Executioner", crit: 10 }],
              [{ n: "Unbreakable", def: 30 }, { n: "Berserk", atk: 15 }]],
    cleric:  [[{ n: "Gentle hands", heal: 20 }, { n: "Smite", atk: 15 }],
              [{ n: "Sanctuary", def: 25 }, { n: "Swift prayer", spd: 8 }],
              [{ n: "Lay on hands", heal: 25 }, { n: "Martyr's vigor", hp: 18 }],
              [{ n: "Halo", heal: 30 }, { n: "Wrath", atk: 18 }]],
    ranger:  [[{ n: "Eagle eye", crit: 10 }, { n: "Broadhead", atk: 12 }],
              [{ n: "Quickdraw", spd: 10 }, { n: "Leather & luck", hp: 15 }],
              [{ n: "Deadeye", crit: 12 }, { n: "Barbed arrows", atk: 14 }],
              [{ n: "Wind runner", spd: 10 }, { n: "Hunter's mark", atk: 16 }]],
    mage:    [[{ n: "Kindling", atk: 12 }, { n: "Ward", hp: 18 }],
              [{ n: "Quickened", spd: 8 }, { n: "Arcane focus", crit: 10 }],
              [{ n: "Wildfire", atk: 15 }, { n: "Mirror skin", def: 30 }],
              [{ n: "Time slip", spd: 10 }, { n: "Starfall", atk: 18 }]],
  };
  const ROMAN = ["I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X"];
  function talentFor(cls, tier) { // tier 1,2,3...
    const set = TALENTS[cls], pair = set[(tier - 1) % set.length], lap = Math.floor((tier - 1) / set.length);
    return pair.map(t => ({ ...t, n: lap ? t.n + " " + ROMAN[Math.min(lap, 9)] : t.n }));
  }

  const REGIONS = [
    { name: "Greenhollow",  foes: ["Bramble wolf", "Mossback boar", "Goblin hexer"],  boss: "Old Grimtusk" },
    { name: "Whisperwood",  foes: ["Thorn sprite", "Shadow stag", "Hollow witch"],     boss: "The Weeping Elder" },
    { name: "Bogmire",      foes: ["Mire leech", "Rotting ghoul", "Bog hag"],          boss: "Mother of Murk" },
    { name: "Stonepeak",    foes: ["Harpy", "Rock troll", "Cairn shaman"],             boss: "King under the Cairn" },
    { name: "Ashen Wastes", foes: ["Cinder imp", "Sand wyrmling", "Ash cultist"],      boss: "The Burnt Prophet" },
    { name: "Frostspire",   foes: ["Frost wight", "Yeti", "Rime caller"],             boss: "Queen of Long Winter" },
    { name: "Shadowfen",    foes: ["Wraith", "Bone knight", "Night hag"],             boss: "The Hollow Crown" },
    { name: "Dragon's Maw", foes: ["Flame wyvern", "Magma golem", "Drake priest"],     boss: "Vyrmax the Ember Tyrant" },
  ];
  const GEARK = 2, FOEHP = 1.6, FOEATK = 1.3, GEARP = 10;
  const NODES = 10; // node 9 is the boss
  const ARCH = [
    { k: "swift", hp: 42, atk: 6, def: 3, spd: 13 },
    { k: "brute", hp: 85, atk: 8, def: 7, spd: 7 },
    { k: "caster", hp: 48, atk: 6, def: 2, spd: 9 },
  ];
  const BOSS = { k: "boss", hp: 520, atk: 13, def: 8, spd: 8 };
  function regionName(r) { return r < REGIONS.length ? REGIONS[r].name : "The Deep Maw " + (r - REGIONS.length + 1); }
  function regionDef(r) { return REGIONS[Math.min(r, REGIONS.length - 1)]; }
  const RL = [1, 11, 24, 39, 55, 71, 87, 103];
  function foeLevel(r, n) {
    const base = r < RL.length ? RL[r] : RL[RL.length - 1] + (r - RL.length + 1) * 11;
    const span = r === 0 ? 4 : 7;
    return base + Math.floor(n * span / 10);
  }

  const EVENTS = [
    { id: "harvest", name: "Harvest Moon", desc: "Heroes earn half again as much experience.", xp: 150, gold: 100 },
    { id: "goldrush", name: "Gold Rush", desc: "Foes drop more gold.", xp: 100, gold: 170 },
    { id: "bard", name: "Bard's Song", desc: "Heroes act faster in every fight.", xp: 100, gold: 100, spd: 15 },
    { id: "bloodmoon", name: "Blood Moon", desc: "Foes are stronger, but give almost double rewards.", xp: 190, gold: 190, foe: 125 },
    { id: "sage", name: "Wandering Sage", desc: "Heroes behind the party leader catch up three times faster.", xp: 100, gold: 100, catchup: 3 },
  ];
  const BLOCK = 6 * HOUR;
  function eventAt(t) {
    const b = Math.floor(t / BLOCK), h = hash("ev", b);
    if (h % 100 >= 55) return null;
    const e = EVENTS[(h >>> 8) % EVENTS.length];
    return { ...e, start: b * BLOCK, end: (b + 1) * BLOCK };
  }
  const weekOf = t => Math.floor((t - WEEK0) / WEEK);
  const weekStart = w => WEEK0 + w * WEEK;
  const STRIKE_HOUR = 18; // daily raid strike at 18:00 UTC

  // ---------- heroes ----------
  function mods(h) {
    const m = { hp: 0, atk: 0, def: 0, spd: 0, heal: 0, crit: 0 };
    h.tal.forEach((c, i) => { if (c == null) return; const t = talentFor(h.cls, i + 1)[c]; for (const k in t) if (k !== "n") m[k] += t[k]; });
    return m;
  }
  function heroStats(h, ev) {
    const c = CLASSES[h.cls], m = mods(h), g = G[Math.min(h.lvl, 500)];
    const spd = c.spd * (100 + m.spd + (ev && ev.spd || 0)) / 100;
    return {
      hp: Math.floor(c.hp * g * (100 + GEARP * h.a) / 100 * (100 + m.hp) / 100),
      atk: Math.floor(c.atk * g * (100 + GEARP * h.w) / 100 * (100 + m.atk) / 100),
      def: Math.floor(c.def * g * (100 + GEARP * h.a) / 100 * (100 + m.def) / 100),
      cd: Math.floor(20000 / spd), crit: 5 + m.crit, heal: m.heal,
    };
  }
  const FACTOR = { warrior: 100, cleric: 50, ranger: 125, mage: 165 };
  function power(S) {
    let p = 0;
    for (const h of S.heroes) { const s = heroStats(h); p += Math.floor(s.atk * 30000 / s.cd * FACTOR[h.cls] / 100); }
    return p;
  }

  // ---------- encounters ----------
  function encounter(S, seed) {
    const r = rng(seed), n = S.node, reg = S.region, lvl = foeLevel(reg, n), ev = eventAt(S.t);
    const foes = [];
    const scale = ev && ev.foe || 100;
    const mk = (a, l, extra) => {
      const g = G[Math.min(l, 500)] * scale / 100 * (100 + l * GEARK) / 100;
      return { k: a.k, lvl: l, hp: Math.floor(a.hp * g * FOEHP), atk: Math.floor(a.atk * g * FOEATK), def: Math.floor(a.def * g), spd: a.spd };
    };
    if (n === NODES - 1) {
      const b = mk(BOSS, lvl + 1); b.name = regionDef(reg).boss; b.ai = 0; foes.push(b);
      for (let i = 0; i < 2; i++) { const f = mk(ARCH[0], lvl - 1); f.name = regionDef(reg).foes[0]; f.ai = 1; foes.push(f); }
    } else {
      let count = 2 + Math.floor(r() * 3);
      if (reg === 0 && n < 3) count = 1 + Math.floor(r() * 2);
      for (let i = 0; i < count; i++) {
        const ai = Math.floor(r() * 3), f = mk(ARCH[ai], lvl + (r() < 0.25 ? 1 : 0));
        f.name = regionDef(reg).foes[ai]; f.ai = ai + 1; foes.push(f);
      }
    }
    return foes;
  }

  // Runs one group fight. Returns win, duration (ms) and optionally a full action log for the battle view.
  function fight(heroes, foes, seed, ev, wantLog) {
    const r = rng(seed), U = [], log = wantLog ? [] : null;
    heroes.forEach((h, i) => { const s = heroStats(h, ev); U.push({ s: 0, i, cls: h.cls, k: "", hp: s.hp, max: s.hp, atk: s.atk, def: s.def, cd: s.cd, crit: s.crit, heal: s.heal, n: 0, next: 0 }); });

  c.font = "16px 'IM Fell English SC', Georgia, serif"; c.textAlign = "left"; c.fillStyle = "#F3EBD6";
  c.shadowColor = "rgba(0,0,0,.6)"; c.shadowBlur = 4;
  if (!cur) {

    S.heroes.forEach((hh, i) => { const [x, y] = heroSlot(i, S.heroes.length, w, h); drawHero(c, hh.cls, x + (resting ? 0 : ((now / 40) % 6)), y, s, now, false); });

    else { const f = cur.foes[u.i]; drawFoe(c, f.k, reg, x + lunge[i], y, s * (f.k === "boss" ? 1.1 : 1), now, dead); }
    if (!dead) hpbar(c, x, y + 27 * s, (u.s === 1 && cur.foes[u.i].k === "boss" ? 60 : 32) * s, hp[i] / u.max, u.s === 0 ? "#7FC48A" : "#D9645F");
  });

  c.textAlign = "center";
  for (const e of recent) {
    const k = (el - e[0]) / 420, src = pos[e[1]], su = L.units[e[1]];
    for (const [ti, amt, crit] of e[3]) {
      const tp = pos[ti];
      if (e[2] === "o" || (su.s === 0 && S.heroes[su.i] && S.heroes[su.i].cls === "ranger")) {
        const px = src[0] + (tp[0] - src[0]) * Math.min(1, k * 1.6), py = src[1] - 10 + (tp[1] - src[1]) * Math.min(1, k * 1.6);

      c.globalAlpha = 1 - k * 0.8;

      c.fillStyle = e[2] === "h" ? "#9BE3A6" : (L.units[ti].s === 0 ? "#FF9A8F" : "#FFF4D6");
      c.fillText((e[2] === "h" ? "+" : "") + fmt(amt) + (crit ? "!" : ""), tp[0], tp[1] - 32 * s - k * 22);

  }
  c.textAlign = "left"; c.font = "16px 'IM Fell English SC', Georgia, serif"; c.fillStyle = "#F3EBD6";
  const title = boss ? "Boss fight: " + cur.foes[0].name : X.regionName(cur.r) + " · encounter " + (cur.n + 1) + " of " + X.NODES;
  c.fillText(title, 12, 24);
  const names = [...new Set(cur.foes.map(f => f.name))].join(", ");
  c.font = "14px 'Alegreya Sans', sans-serif"; c.fillStyle = "rgba(243,235,214,.85)";
  c.fillText(names + " · level " + cur.foes[0].lvl, 12, 44);
  if (now >= cur.end - 1500) { c.font = "22px 'IM Fell English SC', Georgia, serif"; c.textAlign = "center"; c.fillStyle = cur.win ? "#FFE08A" : "#FF9A8F"; c.fillText(cur.win ? "Victory" : "The party falls back", w / 2, h * 0.3); }
  c.shadowBlur = 0;
}

const Cloud = (() => {
  let fb = null, db = null, auth = null, user = null, configured = false, ver = 0;
  let remote = null, unsubUser = null, unsubMembers = null, unsubRaid = null, unsubBless = null;
  let members = [], raid = null, prevRaid = null, guild = null, guildName = "", status = "", err = "", lastPublish = 0, lastCkpt = 0, blessSentDay = null;
  const bump = () => { ver++; };

  async function init() {
    try { const m = await import("./firebase-config.js"); const cfg = m.default || m.firebaseConfig; if (cfg && cfg.apiKey && !String(cfg.apiKey).startsWith("PASTE")) configured = cfg; } catch {}
    if (!configured) { bump(); return; }
    const V = "10.12.2";
    const [app, au, fs] = await Promise.all([
      import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`),
      import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`),
      import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`)]);

    const a = app.initializeApp(configured);

    au.onAuthStateChanged(auth, u => {

      user = u; bump(); render(true);

  }

  async function startSync() {
    const ref = fb.doc(db, "lf_users", user.uid);
    status = "Reading your realm…"; bump();

    if (!snap.exists()) {
      // first sign-in anywhere: this browser's realm becomes the account's realm
      await fb.setDoc(ref, { seed: save.seed, created: save.created, decisions: save.decisions, ckpts: save.ckpts || [], guild: null, nick: firstName() });
    } else {
      const r = snap.data();
      if (r.seed !== save.seed || r.created !== save.created) {
        const localFresh = !save.decisions.length && Date.now() - save.created < 2 * X.HOUR;
        const keepCloud = localFresh ? true : await askRealm(r);
        if (keepCloud) { save = { seed: r.seed, created: r.created, decisions: r.decisions || [], ckpts: r.ckpts || [] }; persist(); snaps = []; await rebuild("adopt"); }

      await mergeDecisions(remote.decisions || []);
      for (const c of remote.ckpts || []) if (!(save.ckpts || []).some(x => x.t === c.t) && X.decisionsHash(D, c.t) === c.h) { save.ckpts = (save.ckpts || []).concat([c]).slice(-4); persist(); }

      const missing = save.decisions.filter(d => !theirs.has(d.id));

      else { status = "Saved to your Google account at " + clock(Date.now()); err = ""; }
      if ((remote.guild || null) !== guild) watchGuild(remote.guild || null);
      bump(); render(true);
    }, e => { err = "Sync stopped (" + (e.code || e.message) + "). Reload the page to retry."; bump(); });
  }
  function firstName() { return ((user && user.displayName) || "Adventurer").split(" ")[0].slice(0, 20); }

  function askRealm(r) {
    return new Promise(async resolve => {
      let st;
      try {
        const DD = X.sortDecisions(r.decisions || []);
        let base = null; for (const c of r.ckpts || []) if (X.decisionsHash(DD, c.t) === c.h && (!base || c.t > base.t)) base = c;

      const sum = s => s ? `${esc(s.heroes[0].name)}'s company · level ${Math.max(...s.heroes.map(h => h.lvl))} · ${esc(X.regionName(s.region))}` : "Unknown";
      $("choicecard").innerHTML = `<h2>Two realms found</h2><p>This browser has a different realm than your Google account. Pick the one to keep. The other one is replaced.</p>
        <div class="choices"><button class="btn" id="keepCloud"><b>Keep the account's realm</b><br>${sum(st)}</button>
        <button class="btn" id="keepLocal"><b>Keep this browser's realm</b><br>${sum(S)}</button></div>`;

  async function pushDecisions(list) {

      const list = s.docs.map(d => ({ id: "b_" + d.id, at: d.data().at, k: "bless", from: d.data().fromNick || "A guildmate" }));
      const have = new Set(save.decisions.map(d => d.id));
      const add = list.filter(d => !have.has(d.id) && typeof d.at === "number");
      if (add.length) { await mergeDecisions(add); pushDecisions(add); bump(); render(true); }
    }, () => {});
    publish(true);
  }
  async function ensureRaid() {
    if (!raid || raid.hp || !members.length || !guild) return;
    const w = raid.week, ref = fb.doc(db, "lf_guilds", guild, "raids", String(w));
    const total = members.reduce((a, m) => a + (m.power || 0), 0);
    try {
      await fb.runTransaction(db, async tx => { const s = await tx.get(ref); if (!s.exists()) tx.set(ref, { hp: Math.max(1000, total * 5), created: Date.now() }); });
    } catch {}
  }
  function raidDmg(m, w) { return m.raid && m.raid[w] ? m.raid[w] : 0; }
  function myRaid() {
    const w = X.weekOf(Date.now()), map = {};
    if (S.raid.week === w || S.raid.week === w - 1) map[S.raid.week] = S.raid.dmg;
    for (const h of S.raidHist) if (h.week >= w - 1) map[h.week] = h.dmg;
    return map;
  }
  async function publish(force) {
    if (!user || !guild || !S) return;
    if (!force && Date.now() - lastPublish < 4 * X.MIN) return;
    lastPublish = Date.now();
    const me = members.find(m => m.uid === user.uid);
    try {
      await fb.setDoc(fb.doc(db, "lf_guilds", guild, "members", user.uid), {
        nick: (me && me.nick) || (remote && remote.nick) || firstName(),
        company: S.heroes[0].name, lvl: Math.max(...S.heroes.map(h => h.lvl)), heroes: S.heroes.map(h => h.cls[0] + h.lvl).join(" "),
        region: S.region, node: S.node, power: X.power(S), raid: myRaid(), updated: Date.now(),
      }, { merge: true });
    } catch (e) { err = "Couldn't update the guild (" + (e.code || e.message) + ")."; bump(); }
  }
  async function createGuild(name, nick) {
    const code = uid8() + uid8().slice(0, 2);
    await fb.setDoc(fb.doc(db, "lf_guilds", code), { name: name.slice(0, 40), owner: user.uid, created: Date.now() });
    await fb.setDoc(fb.doc(db, "lf_guilds", code, "members", user.uid), { nick, joined: Date.now() });
    await fb.updateDoc(fb.doc(db, "lf_users", user.uid), { guild: code, nick });
  }
  async function joinGuild(code, nick) {
    code = code.trim().toLowerCase();
    const g = await fb.getDoc(fb.doc(db, "lf_guilds", code));
    if (!g.exists()) throw new Error("No guild uses that code. Check it with whoever shared it.");
    const mref = fb.doc(db, "lf_guilds", code, "members", user.uid);
    await fb.setDoc(mref, { nick, joined: Date.now() });
    const all = await fb.getDocs(fb.collection(db, "lf_guilds", code, "members"));
    if (all.size > 10) { await fb.deleteDoc(mref); throw new Error("That guild is full (10 members)."); }
    await fb.updateDoc(fb.doc(db, "lf_users", user.uid), { guild: code, nick });
  }
  async function leaveGuild() {
    const code = guild;
    await fb.updateDoc(fb.doc(db, "lf_users", user.uid), { guild: null });
    try { await fb.deleteDoc(fb.doc(db, "lf_guilds", code, "members", user.uid)); } catch {}
  }
  async function bless(to) {
    const day = Math.floor(Date.now() / X.DAY);
    const me = members.find(m => m.uid === user.uid);
    await fb.setDoc(fb.doc(db, "lf_guilds", guild, "blessings", user.uid + "_" + day), { from: user.uid, fromNick: (me && me.nick) || firstName(), to, at: Date.now() });
    blessSentDay = day;
  }

  function claimable() {
    if (!guild || !S) return null;
    for (const r of [prevRaid, raid]) {
      if (!r || !r.hp || r.week <= S.lastClaim) continue;
      if (queued().some(d => d.k === "claim" && d.w === r.week)) continue;
      const total = members.reduce((a, m) => a + raidDmg(m, r.week), 0);
      if (total >= r.hp) return r.week;
    }
    return null;
  }
  function paneHTML() {
    if (!configured) return `<h2>Guild</h2><p>Online play isn't set up on this copy of the page, so the realm lives only in this browser. The README explains how to connect Firebase.</p>`;
    if (!user) return `<h2>Guild</h2><p>Sign in to keep your realm on every device, join a guild with friends, strike the weekly raid boss together and send each other blessings.</p><button class="btn gold" data-act="signin">Sign in with Google</button>${err ? `<p class="err">${esc(err)}</p>` : ""}`;
    if (!guild) return `<h2>Guild</h2><p>A guild is up to 10 friends. Your parties appear on each other's maps and strike a shared raid boss every week.</p>
      <div class="field"><input id="nick" maxlength="20" placeholder="Your name in the guild" value="${esc((remote && remote.nick) || firstName())}"></div>
      <h3>Start a guild</h3><div class="field"><input id="gname" maxlength="40" placeholder="Guild name"><button class="btn gold" data-act="create">Create</button></div>
      <h3>Join with a code</h3><div class="field"><input id="gcode" maxlength="12" placeholder="Code from a friend"><button class="btn" data-act="join">Join</button></div>
      ${err ? `<p class="err">${esc(err)}</p>` : ""}`;
    const w = X.weekOf(Date.now()), now = Date.now();
    const boss = X.RAID_BOSSES[((w % X.RAID_BOSSES.length) + X.RAID_BOSSES.length) % X.RAID_BOSSES.length];
    const total = members.reduce((a, m) => a + raidDmg(m, w), 0), hp = raid && raid.hp || 0;
    const mine = myRaid()[w] || 0, myN = S.raid.week === w ? S.raid.n : 0;
    const endsIn = X.weekStart(w + 1) - now;
    const cw = claimable();
    const day = Math.floor(now / X.DAY);
    let html = `<h2>${esc(guildName || "Your guild")}</h2><p class="hint">Invite code: <span class="code">${esc(guild)}</span></p>
      <div class="raid"><strong>${esc(boss)}</strong><div class="hint">This week's raid boss · ends in ${dur(endsIn)}</div>
      <div class="bar red"><i style="width:${hp ? Math.min(100, total / hp * 100).toFixed(1) : 0}%"></i></div>
      <div>${hp ? (total >= hp ? "Defeated! Everyone in the guild can collect spoils." : fmt(total) + " of " + fmt(hp) + " damage dealt") : "Waking the boss…"}</div>
      <div class="hint">Your party struck ${myN} time${myN === 1 ? "" : "s"} this week for ${fmt(mine)} damage.</div>
      ${cw != null ? `<button class="btn gold" data-act="claim" data-w="${cw}">Collect raid spoils</button>` : ""}</div><ul class="members">`;
    members.slice().sort((a, b) => (b.power || 0) - (a.power || 0)).forEach((m, i) => {
      const idx = Cloud.mates().findIndex(x => x.uid === m.uid);
      const sw = m.uid === user.uid ? css("--gilt") : MATE_COLORS[(idx < 0 ? 0 : idx) % MATE_COLORS.length];
      html += `<li><span class="mn"><span class="sw" style="background:${sw}"></span>${esc(m.nick || "Someone")}${m.uid === user.uid ? " (you)" : ""}</span>
        <span class="md">${m.region != null ? "Level " + (m.lvl || 1) + " · " + esc(X.regionName(m.region)) + " · strike " + fmt(m.power || 0) : "Hasn't opened the game since joining"}</span>
        ${m.uid !== user.uid ? `<button class="btn" data-act="bless" data-to="${esc(m.uid)}" ${blessSentDay === day ? "disabled" : ""}>${blessSentDay === day ? "Blessing sent today" : "Send blessing"}</button>` : ""}</li>`;
    });
    html += `</ul><p class="hint">You can send one blessing a day. It gives the receiver more experience for two hours.</p>
      ${err ? `<p class="err">${esc(err)}</p>` : ""}<p><button class="btn" data-act="leave">Leave guild</button></p>`;
    return html;
  }
  function footHTML() {
    if (!configured) return "Your realm is saved in this browser.";
    if (!user) return `Your realm is saved in this browser. <button data-act="signin">Sign in with Google</button> to keep it on every device.`;
    return `${esc(err || status || "Connecting…")} · ${esc(user.email || "")} <button data-act="signout">Sign out</button>`;
  }
  async function onClick(b) {
    const act = b.dataset.act; if (!act) return;
    err = "";
    try {
      if (act === "signin") { try { await fb.signInWithPopup(auth, new fb.GoogleAuthProvider()); } catch (e) { if (e.code === "auth/popup-blocked") await fb.signInWithRedirect(auth, new fb.GoogleAuthProvider()); else throw e; } }
      else if (act === "signout") await fb.signOut(auth);
      else if (act === "create") { const n = $("gname").value.trim(); if (!n) throw new Error("Give the guild a name first."); await createGuild(n, ($("nick").value.trim() || firstName()).slice(0, 20)); }
      else if (act === "join") { const c = $("gcode").value.trim(); if (!c) throw new Error("Paste the code a friend sent you."); await joinGuild(c, ($("nick").value.trim() || firstName()).slice(0, 20)); }
      else if (act === "leave") { if (confirm("Leave the guild? You can join again with the code.")) await leaveGuild(); }
      else if (act === "bless") { await bless(b.dataset.to); }
      else if (act === "claim") decide({ k: "claim", w: +b.dataset.w });
    } catch (e) { err = e.message && !e.code ? e.message : "That didn't work (" + (e.code || e.message) + ")."; }
    bump(); render(true);
  }
  function tick() {
    if (!user || !S) return;
    publish(false);
    if (Date.now() - lastCkpt > 15 * X.MIN) { lastCkpt = Date.now(); makeCkpts(); pushCkpts(); }
  }
  return {
    init, pushDecisions, paneHTML, footHTML, onClick, tick, version: () => ver,
    mates: () => user ? members.filter(m => m.uid !== user.uid) : [],
  };
})();

// =====================================================================
// Main loop
// =====================================================================
const lvSum = s => s.heroes.reduce((a, h) => a + h.lvl, 0);
function rememberSeen() { if (S && !busy) { save.seen = { t: Date.now(), fights: S.fights, wins: S.wins, lv: lvSum(S), gold: S.gold, seed: save.seed }; persist(); } }
function awaySummary(before, after) {
  if (!before || before.seed !== save.seed) return;
  const gap = Date.now() - before.t;
  if (gap < 30 * X.MIN || after.fights <= before.fights) return;
  const lines = [];
  lines.push(`${fmt(after.fights - before.fights)} fights, ${fmt(after.wins - before.wins)} won.`);
  const dl = lvSum(after) - before.lv; if (dl > 0) lines.push(`The party gained ${dl} level${dl === 1 ? "" : "s"} in total.`);
  const g = after.gold - before.gold; lines.push(`${g >= 0 ? "+" : ""}${fmt(g)} gold after upgrades.`);
  const bosses = after.log.filter(l => l[1] === "boss" && l[0] > before.t); for (const b of bosses) lines.push(b[2]);
  const rec = after.log.filter(l => l[1] === "recruit" && l[0] > before.t); for (const b of rec) lines.push(b[2]);
  const t = document.createElement("div"); t.className = "toast";
  t.innerHTML = `<h4>While you were away · ${dur(gap)}</h4>${lines.map(l => `<p>${esc(l)}</p>`).join("")}<button class="btn">Close</button>`;
  t.querySelector("button").onclick = () => t.remove();
  document.body.appendChild(t);
}

async function boot() {
  const before = save.seen;
  await rebuild("boot");
  awaySummary(before, S); rememberSeen();
  makeCkpts();
  render(true);
  Cloud.init().then(() => render(true));
  const frame = () => {
    if (S && !busy) {
      const now = Date.now();
      const f = S.fights;
      X.advance(S, now, D, onSnap);
      if (S.fights !== f) render(false);
      drawMap(now); drawBattle(now);
    }
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
  setInterval(() => { if (S && !busy) { render(false); Cloud.tick(); } }, 1000);
  setInterval(() => { if (document.visibilityState === "visible") rememberSeen(); }, 20000);
  setInterval(() => { if (S && !busy) makeCkpts(); }, 5 * X.MIN);
  document.addEventListener("visibilitychange", async () => {
    if (document.visibilityState === "visible" && S) {
      const pre = save.seen; if (Date.now() - S.t > 30 * X.MIN) { busy = true; await catchUp(S, Date.now()); }
      awaySummary(pre, S); rememberSeen(); render(true);
    } else if (document.visibilityState === "hidden") { makeCkpts(); rememberSeen(); }
  });
  window.__lf = { get S() { return S; }, get save() { return save; }, decide, rebuild, mergeDecisions };
}
boot();
</script>
