<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wyrmroad</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐉</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@500;700&family=Signika:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: dark;
  --bg: #1D1720; --panel: #271F2B; --panel2: #33293A; --well: #160F19;
  --ink: #EDE6EE; --muted: #A99CAF; --line: #45384C;
  --wyrm: #8CCB8F; --steel: #C7D0D8; --coin: #E3BC55; --blood: #E0707A;
  --r0: #C9C2CC; --r1: #7FD08C; --r2: #74A9F0; --r3: #F0A64E;
  --display: "Grenze Gotisch", "Palatino Linotype", Georgia, serif;
  --sans: "Signika", "Segoe UI", system-ui, sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg: #EEE8EF; --panel: #F8F4F8; --panel2: #E9E1EB; --well: #DCD2DF;
    --ink: #2A2030; --muted: #6E6175; --line: #CFC3D3;
    --wyrm: #2E7A3A; --steel: #4E5D6B; --coin: #8E6A10; --blood: #A8323F;
    --r0: #5A5060; --r1: #2E7A3A; --r2: #2E5FA8; --r3: #A85E10;
  }
}
*, *::before, *::after { box-sizing: inherit; }
[hidden] { display: none !important; }
html { height: 100%; }
body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--sans); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--wyrm); outline-offset: 2px; }

.top { display: flex; align-items: center; gap: 14px; padding: 10px 16px 6px; flex-wrap: wrap; }
.top h1 { font: 700 40px/1 var(--display); margin: 0; color: var(--wyrm); }
.top .who { font: 600 16px var(--sans); color: var(--muted); }
.top .purse { margin-left: auto; display: flex; gap: 16px; align-items: baseline; font-variant-numeric: tabular-nums; }
.top .purse b { color: var(--coin); }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 14px; padding: 0 14px 14px; max-width: 1520px; margin: 0 auto; }
@media (max-width: 1000px) { .layout { grid-template-columns: minmax(0, 1fr); padding: 0 8px 10px; gap: 10px; } }
.stage { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.frame { position: relative; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: var(--well); }
#map { display: block; width: 100%; height: auto; aspect-ratio: 1000 / 640; cursor: pointer; }
#battle { display: block; width: 100%; height: 230px; }
@media (max-width: 600px) { #battle { height: 200px; } }

.side { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column; min-width: 0; max-height: calc(100vh - 76px); position: sticky; top: 10px; }
@media (max-width: 1000px) { .side { max-height: none; position: static; } }
.tabs { display: flex; flex-shrink: 0; border-bottom: 1px solid var(--line); overflow-x: auto; background: var(--panel); border-radius: 10px 10px 0 0; }
@media (max-width: 1000px) { .tabs { position: sticky; top: 0; z-index: 5; } }
.tabs button { flex: 1 0 auto; background: none; border: 0; padding: 10px 6px 8px; cursor: pointer; color: var(--muted); font: 700 17px var(--display); border-bottom: 3px solid transparent; position: relative; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--wyrm); }
.tabs button[data-tab="hero"] { padding-right: 24px; }
.tabs .dot { position: absolute; top: 7px; right: 2px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--wyrm); color: var(--bg); font: 600 11px/16px var(--sans); }
.pane { padding: 14px 16px 18px; overflow-y: auto; }
.pane h2 { font: 700 27px/1.1 var(--display); margin: 0 0 8px; }
.pane h3 { font: 700 21px/1.2 var(--display); margin: 18px 0 6px; color: var(--wyrm); }
.pane p { margin: 6px 0; max-width: 62ch; }
.hint { color: var(--muted); font-size: 14px; }

.bar { height: 7px; background: var(--well); border-radius: 4px; overflow: hidden; margin: 6px 0; }
.bar i { display: block; height: 100%; background: var(--wyrm); }
.bar.red { height: 11px; } .bar.red i { background: var(--blood); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 4px 12px; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.grid b { color: var(--ink); font-weight: 600; }
.btn { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 5px 12px; cursor: pointer; font-size: 14px; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--wyrm); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.go { background: var(--wyrm); border-color: var(--wyrm); color: var(--bg); font-weight: 600; }

.pick { border: 1px solid var(--wyrm); border-radius: 8px; padding: 10px 12px; margin: 10px 0; background: color-mix(in srgb, var(--wyrm) 7%, transparent); }
.pick.major { border-width: 2px; }
.pick .opts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 8px; }
@media (max-width: 420px) { .pick .opts { grid-template-columns: 1fr; } }
.pick .opts .btn { white-space: normal; text-align: left; padding: 7px 9px; line-height: 1.3; }
.pick .opts .btn b { display: block; font-size: 15px; }
.pick .opts .btn span { color: var(--muted); font-size: 13px; }

.item { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 9px 0; border-bottom: 1px solid var(--line); align-items: center; }
.item:last-child { border-bottom: 0; }
.item .nm { font-weight: 600; }
.item .nm.r0 { color: var(--r0); } .item .nm.r1 { color: var(--r1); } .item .nm.r2 { color: var(--r2); } .item .nm.r3 { color: var(--r3); }
.item .ds { grid-column: 1; font-size: 13px; color: var(--muted); }
.item .act { grid-row: 1 / span 2; grid-column: 2; display: flex; flex-direction: column; gap: 4px; align-items: stretch; }
.up { color: var(--wyrm); font-weight: 600; } .down { color: var(--blood); }
.slot { font-size: 12px; color: var(--muted); text-transform: none; }
.tags { display: flex; flex-wrap: wrap; gap: 4px 6px; font-size: 13px; }
.tags span { background: var(--panel2); border-radius: 4px; padding: 1px 7px; }
.queued { font-size: 14px; color: var(--muted); border-left: 3px solid var(--wyrm); padding: 2px 10px; margin: 8px 0; }

.log { list-style: none; padding: 0; margin: 0; }
.log li { padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.log li time { display: block; font-size: 12px; color: var(--muted); }
.log li.boss { color: var(--wyrm); } .log li.loss { color: var(--blood); } .log li.raid { color: var(--coin); }
.event { padding: 8px 0; border-bottom: 1px solid var(--line); }
.event strong { font: 700 19px var(--display); }
.event .when { color: var(--muted); font-size: 13px; }

.members { list-style: none; padding: 0; margin: 0; }
.members li { display: grid; grid-template-columns: 54px 1fr; gap: 0 10px; padding: 6px 0; border-bottom: 1px solid var(--line); align-items: center; }
.members canvas { width: 54px; height: 60px; }
.members .md { color: var(--muted); font-size: 13px; }
.field { display: flex; gap: 8px; margin: 8px 0; }
.field input { flex: 1; min-width: 0; background: var(--well); border: 1px solid var(--line); color: var(--ink); padding: 7px 10px; border-radius: 6px; font: inherit; }
.code { font: 600 18px var(--sans); letter-spacing: .08em; color: var(--coin); user-select: all; }
.err { color: var(--blood); font-size: 14px; }
.raidbox { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin: 10px 0; background: var(--panel2); }
.raidbox strong { font: 700 24px var(--display); }
#tavcv { display: block; width: 100%; height: 250px; border-radius: 8px; background: #2A1C14; margin: 8px 0; }
.chat { list-style: none; padding: 0; margin: 6px 0; max-height: 320px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
.chat li { background: var(--panel2); border-radius: 8px; padding: 6px 10px; max-width: 88%; font-size: 15px; overflow-wrap: anywhere; }
.chat li.me { align-self: flex-end; background: color-mix(in srgb, var(--wyrm) 22%, var(--panel2)); }
.chat li.sys { align-self: center; background: none; color: var(--coin); font-size: 13px; }
.chat li b { font-size: 13px; } .chat li time { font-size: 11px; color: var(--muted); margin-left: 6px; }
.fellow { display: flex; gap: 10px; flex-wrap: wrap; margin: 6px 0; }
.fellow div { display: flex; align-items: center; gap: 6px; background: var(--panel2); border-radius: 8px; padding: 2px 10px 2px 2px; font-size: 14px; }
.fellow canvas { width: 34px; height: 40px; }
#holdcv { display: block; width: 100%; height: 190px; border-radius: 8px; background: var(--well); margin: 8px 0; }
.bld { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 9px 0; border-bottom: 1px solid var(--line); align-items: center; }
.bld .nm { font-weight: 600; } .bld .ds { grid-column: 1; font-size: 13px; color: var(--muted); }
.bld .act { grid-row: 1 / span 3; grid-column: 2; display: flex; gap: 4px; }
.bld .act .btn { padding: 4px 8px; font-size: 13px; }
.bld .bar { grid-column: 1; margin: 2px 0; }
.bouts { list-style: none; padding: 0; margin: 0; }
.bouts li { display: grid; grid-template-columns: 1fr auto; padding: 7px 0; border-bottom: 1px solid var(--line); align-items: center; gap: 2px 8px; }
.bouts .md { color: var(--muted); font-size: 13px; }
.standings { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
.standings td, .standings th { padding: 5px 4px; border-bottom: 1px solid var(--line); text-align: left; }
.standings th { color: var(--muted); font-weight: 400; }
.standings td:not(:first-child), .standings th:not(:first-child) { text-align: right; }
#duelcv { display: block; width: 100%; height: 240px; border-radius: 8px; background: var(--well); margin: 8px 0; }
#raidcv { display: block; width: 100%; height: 310px; border-radius: 8px; background: var(--well); margin: 8px 0; }
.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; font-size: 12px; text-align: center; margin: 8px 0; }
.days button { background: var(--well); border: 0; border-radius: 5px; padding: 4px 2px; color: var(--muted); font-size: 12px; cursor: pointer; }
.days button:disabled { cursor: default; }
.days button.done { color: var(--ink); } .days button.kill { background: color-mix(in srgb, var(--wyrm) 30%, var(--well)); color: var(--ink); }
.days button.sel { outline: 2px solid var(--wyrm); }
.days b { display: block; font-weight: 600; }

.foot { text-align: center; color: var(--muted); font-size: 13px; padding: 4px 10px 18px; }
.foot button { background: none; border: 0; color: var(--wyrm); cursor: pointer; text-decoration: underline; font-size: 13px; padding: 0 4px; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--panel2); border: 1px solid var(--wyrm); border-radius: 10px; padding: 12px 16px; max-width: min(520px, calc(100vw - 24px)); z-index: 20; box-shadow: 0 8px 28px rgba(0,0,0,.4); }
.toast h4 { margin: 0 0 4px; font: 700 23px var(--display); color: var(--wyrm); }
.toast p { margin: 2px 0; }
.veil { position: fixed; inset: 0; background: color-mix(in srgb, var(--bg) 92%, transparent); display: grid; place-items: center; z-index: 30; overflow-y: auto; padding: 16px 0; }
.veil[hidden] { display: none; }
.veil .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px 22px; max-width: 480px; width: calc(100vw - 24px); }
.veil h2 { font: 700 32px/1.1 var(--display); margin: 0 0 8px; color: var(--wyrm); }
.veil .choices { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
.veil .choices .btn { text-align: left; padding: 10px 14px; white-space: normal; }

/* hero creator */
.creator { max-width: 760px !important; }
.creator .cols { display: grid; grid-template-columns: 200px 1fr; gap: 18px; }
@media (max-width: 620px) { .creator .cols { grid-template-columns: 1fr; } }
#preview { width: 200px; height: 230px; background: var(--well); border-radius: 10px; display: block; margin: 0 auto; }
.paths { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
@media (max-width: 420px) { .paths { grid-template-columns: 1fr; } }
.paths button { text-align: left; background: var(--panel2); border: 2px solid transparent; border-radius: 8px; padding: 7px 10px; cursor: pointer; line-height: 1.3; }
.paths button[aria-pressed="true"] { border-color: var(--wyrm); }
.paths b { display: block; } .paths span { font-size: 13px; color: var(--muted); }
.swatches { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 10px; }
.swatches button { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); cursor: pointer; padding: 0; }
.swatches button[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 2px var(--wyrm); }
.swatches.txt button { width: auto; height: auto; border-radius: 6px; padding: 3px 10px; background: var(--panel2); }
.lbl { font-size: 13px; color: var(--muted); margin-top: 8px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header class="top">
  <h1>Wyrmroad</h1>
  <span class="who" id="who"></span>
  <div class="purse"><span><b id="gold">0</b> gold</span><span id="lvl"></span></div>
</header>
<main class="layout" id="game" hidden>
  <section class="stage">
    <div class="frame"><canvas id="map" width="1000" height="640" aria-label="World map"></canvas></div>
    <div class="frame"><canvas id="battle" aria-label="Current fight"></canvas></div>
  </section>
  <aside class="side">
    <nav class="tabs" role="tablist" id="tabs">
      <button role="tab" data-tab="hero" aria-selected="true">Hero</button>
      <button role="tab" data-tab="merchant">Shop</button>
      <button role="tab" data-tab="tavern">Tavern</button>
      <button role="tab" data-tab="raid">Raid</button>
      <button role="tab" data-tab="arena">Arena</button>
      <button role="tab" data-tab="guild">Guild</button>
      <button role="tab" data-tab="journal">Journal</button>
    </nav>
    <div class="pane" id="pane" role="tabpanel"></div>
  </aside>
</main>
<footer class="foot" id="foot"></footer>
<div class="veil" id="creatorveil" hidden><div class="card creator" id="creator"></div></div>
<div class="veil" id="busy" hidden><div class="card"><h2>Catching up</h2><p id="busytext">Your hero's deeds are being written down…</p></div></div>
<div class="veil" id="choice" hidden><div class="card" id="choicecard"></div></div>

<script>
// ===== Wyrmroad simulation core =====
// Deterministic: only + - * / floor, imul and bit ops (no Math.pow/exp/sin), so phones and PCs agree.
const SIM = (() => {
  const MIN = 60000, HOUR = 3600000, DAY = 86400000, WEEK = 7 * DAY;
  const WEEK0 = 345600000; // Monday 1970-01-05 UTC
  const TRAVEL = 25000, REST = 150000, BLOCK = 6 * HOUR;
  // Rules version 2 (shorter roads, smarter retreats, road events, fellowship) applies from this moment on.
  // Everything before it replays exactly as it did under version 1.
  const V2 = Date.UTC(2026, 9, 28);
  const TRAVEL2 = 10000, EVENT_DUR = 7000, BOSS_CD = 3 * HOUR, CAMP_CD = 45 * MIN;
  const V2XP = 34, V2GOLD = 34, ROADP = 0.03, PARTYK = 88, FOEHP2 = 170, V2LOOT = 15, ELITE = 0.012;
  const RAID_HOUR = 19; // raid every day at 19:00 UTC

  // arena-only adjustments (adventure and raids are unaffected)
  const FOCUS = 2.4, REGENPVP = 300, PVPDEF = 0.5, PVPSTUN = 0.3;
  function rng(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function hash(...xs) {
    let h = 2166136261 >>> 0;
    for (const x of xs) {
      const s = String(x);
      for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
      h ^= 31; h = Math.imul(h, 16777619) >>> 0;
    }
    return h >>> 0;
  }
  function table(start, mul, n) { const t = [start]; for (let i = 1; i <= n; i++) t.push(t[i - 1] * mul); return t; }
  const MAXL = 400;
  const G = table(1, 1.07, MAXL + 20);
  const XPR = table(18, 1.16, MAXL + 20);
  const XPF = table(2, 1.07, MAXL + 20);
  const GOLD = table(2, 1.07, MAXL + 20);
  const lv = l => Math.max(0, Math.min(l, MAXL + 20));

  // ---------------- hero creation ----------------
  const PATHS = {
    sellsword: { name: "Sellsword", desc: "Hardy and practical. More health.", weapon: "sword", armor: "mail", m: { hp: 10 } },
    witch:     { name: "Hedge-witch", desc: "Hits harder with every weapon.", weapon: "staff", armor: "cloth", m: { atk: 10 } },
    poacher:   { name: "Poacher", desc: "Quick and sharp-eyed. Faster, more critical hits.", weapon: "bow", armor: "leather", m: { spd: 6, crit: 4 } },
    acolyte:   { name: "Acolyte", desc: "Heals a little with every swing.", weapon: "mace", armor: "mail", m: { regen: 1, hp: 4 } },
    cutpurse:  { name: "Cutpurse", desc: "Dodges more and finds more gold.", weapon: "daggers", armor: "leather", m: { dodge: 5, gold: 12 } },
  };
  const LOOK = {
    skin: ["#F1D0B5", "#E0AC88", "#C68863", "#9A6440", "#6B4428"],
    hair: ["short", "long", "bald", "braid", "hood", "mohawk"],
    hairc: ["#2B1D14", "#6A3E1F", "#B7782F", "#E5C77A", "#D9D9D9", "#A33A2A"],
    cloak: ["#7A2E3A", "#2F5D50", "#34477A", "#6B4F8A", "#8A6A2E", "#3C3C44", "#2E6E8A", "#9A4E2A"],
  };

  // ---------------- weapons & armor ----------------
  const WEAPONS = {
    sword:   { name: "Sword",     dmg: 100, spd: 100, parry: 8, desc: "Balanced. Parries some blows." },
    axe:     { name: "Axe",       dmg: 132, spd: 82, cleave: 40, desc: "Slow and heavy. Each swing also cuts a second foe." },
    daggers: { name: "Daggers",   dmg: 58, spd: 165, crit: 12, desc: "Very fast. Many critical hits." },
    bow:     { name: "Bow",       dmg: 94, spd: 100, crit: 5, volley: 1, desc: "Opens every fight with a volley at all foes." },
    staff:   { name: "Staff",     dmg: 54, spd: 92, aoe: 1, desc: "Every spell hits all foes." },
    mace:    { name: "Mace",      dmg: 108, spd: 92, stun: 12, desc: "Can stun the target." },
    spear:   { name: "Spear",     dmg: 104, spd: 104, pierce: 40, desc: "Pierces armor." },
    hammer:  { name: "Warhammer", dmg: 165, spd: 64, stun: 22, desc: "Very slow, huge hits, often stuns." },
  };
  const WTYPES = Object.keys(WEAPONS);
  const ARMORS = {
    cloth:   { name: "Robes",   arm: 45, m: { atk: 6 }, desc: "Light. More damage." },
    leather: { name: "Leathers", arm: 72, m: { dodge: 4, spd: 3 }, desc: "Quick. More dodging." },
    mail:    { name: "Mail",    arm: 100, m: {}, desc: "Solid all-round protection." },
    plate:   { name: "Plate",   arm: 140, m: { spd: -6, block: 4 }, desc: "Heaviest. Blocks blows but slows you." },
  };
  const ATYPES = Object.keys(ARMORS);
  const BASENAMES = {
    sword: ["Notched sword", "Arming sword", "Longsword", "Knight's blade", "Runeblade"],
    axe: ["Hatchet", "Bearded axe", "Broadaxe", "Dane axe", "Wyrmcleaver"],
    daggers: ["Paring knives", "Twin dirks", "Stilettos", "Fang daggers", "Shadowfangs"],
    bow: ["Hunting bow", "Yew bow", "Longbow", "Horn bow", "Stormstring"],
    staff: ["Ash staff", "Oak staff", "Carved staff", "Moonwood staff", "Starcaller"],
    mace: ["Club", "Flanged mace", "Morningstar", "Templar mace", "Dawnbreaker"],
    spear: ["Boar spear", "Pike", "Winged spear", "Partisan", "Skypiercer"],
    hammer: ["Maul", "War maul", "Warhammer", "Giant's hammer", "Mountainfall"],
    cloth: ["Wool robe", "Padded robe", "Embroidered robe", "Silk mantle", "Starweave"],
    leather: ["Hide jerkin", "Leather jerkin", "Studded leather", "Drakehide", "Nightskin"],
    mail: ["Rusty mail", "Ring mail", "Chain hauberk", "Scale coat", "Mithral coat"],
    plate: ["Iron breastplate", "Half plate", "Full plate", "Gothic plate", "Wyrmscale plate"],
    charm: ["Bone token", "Copper amulet", "Silver locket", "Jade talisman", "Wyrm's eye"],
  };
  const LEGEND = ["Duskfang", "Oathkeeper", "Grief", "Ironsong", "Wyrmtooth", "Nightglass", "Kingsbane", "Embertide", "Hollowheart", "Stormward", "Mourncrown", "Ashen Vow"];
  const RARITY = ["Common", "Fine", "Masterwork", "Legendary"];
  const RM = [100, 118, 138, 165];

  }

      <p class="hint">Give gold to a building and every member's hero gets its bonus. Builders work overnight: gold given before ${clock(Math.ceil(Date.now() / X.DAY) * X.DAY)} takes effect from then.</p>`;
    X.HOLD.forEach((b, i) => {
      const L = X.holdLevel(live[i]), eff = active[i] || 0;
      html += `<div class="bld"><span class="nm">${esc(b.n)} · level ${L.L}</span>
        <span class="ds">+${b.v * eff}% ${esc(b.d)} now${L.L > eff ? ` · +${b.v * L.L}% once tonight's work is done` : ""}</span>
        <div class="bar"><i style="width:${L.next ? (L.into / L.next * 100).toFixed(1) : 100}%"></i></div>
        <span class="ds">${L.next ? fmt(L.into) + " of " + fmt(L.next) + " gold to level " + (L.L + 1) : "Fully built"}</span>
        <span class="act">${L.next ? [10, 25, 50].map(p => `<button class="btn" data-act="donate" data-b="${i}" data-pct="${p}" title="Give ${p}% of your gold" ${free * p / 100 < 1 ? "disabled" : ""}>${fmt(free * p / 100)}</button>`).join("") : ""}</span></div>`;
    });
    const recent = donations.slice().sort((a, b) => (b.at || Infinity) - (a.at || Infinity)).slice(0, 6);
    if (recent.length) html += `<p class="hint" style="margin-top:10px">${recent.map(d => `${esc(d.nick || "Someone")} gave ${fmt(d.amt)} to the ${esc(X.HOLD[d.b] ? X.HOLD[d.b].n.toLowerCase() : "stronghold")}`).join(" · ")}</p>`;
    html += `${err ? `<p class="err">${esc(err)}</p>` : ""}<p><button class="btn" data-act="leave">Leave guild</button></p>`;
    return html;
  }
  function footHTML() {
    if (!configured) return "Your hero is saved in this browser.";
    if (!user) return `Your hero is saved in this browser. <button data-act="signin">Sign in with Google</button> to keep it on every device.`;
    return `${esc(err || status || "Connecting…")} · ${esc(user.email || "")} <button data-act="signout">Sign out</button>`;
  }
  async function onClick(b) {
    const act = b.dataset.act; if (!act) return;
    if (act === "replay") { setReplay(+b.dataset.i); bump(); render(true); return; }
    if (act === "again") { replayStart = performance.now(); return; }
    if (act === "watch") { watchBout(+b.dataset.d, b.dataset.a, b.dataset.b, 0); bump(); render(true); return; }
    if (act === "round") { const bt = duelState && duelState.bout; if (bt) watchBout(bt.d, bt.a, bt.b, +b.dataset.r); bump(); render(true); return; }
    if (act === "duelagain") { if (duelState) duelState.start = performance.now(); return; }
    if (act === "spar") { spar(b.dataset.uid); bump(); render(true); return; }
    if (act === "speed") { const el = (performance.now() - replayStart) * replaySpeed; replaySpeed = replaySpeed === 1 ? 4 : 1; replayStart = performance.now() - el / replaySpeed; b.textContent = "Speed ×" + replaySpeed; return; }
    err = "";
    try {
      if (act === "signin") { try { await fb.signInWithPopup(auth, new fb.GoogleAuthProvider()); } catch (e) { if (e.code === "auth/popup-blocked") await fb.signInWithRedirect(auth, new fb.GoogleAuthProvider()); else throw e; } }
      else if (act === "signout") await fb.signOut(auth);
      else if (act === "create") { const n = $("gname").value.trim(); if (!n) throw new Error("Give the guild a name first."); await createGuild(n, ($("nick").value.trim() || firstName()).slice(0, 20)); }
      else if (act === "join") { const c = $("gcode").value.trim(); if (!c) throw new Error("Paste the code a friend sent you."); await joinGuild(c, ($("nick").value.trim() || firstName()).slice(0, 20)); }
      else if (act === "donate") await donate(+b.dataset.b, +b.dataset.pct);
      else if (act === "say") await say();
      else if (act === "buyround") await buyRound();
      else if (act === "leave") { if (confirm("Leave the guild? You can join again with the code.")) await leaveGuild(); }
    } catch (e) { err = e.message && !e.code ? e.message : "That didn't work (" + (e.code || e.message) + ")."; }
    bump(); render(true);
  }
  function tick() {
    if (!user || !S) return;
    publish(false); signUp(false);
    if (guild && roster.day !== undefined && roster.day !== nextRaidDay(Date.now())) watchRoster();
    if (guild && Date.now() - lastRaidCalc > 5 * X.MIN) { calcRaids(); calcHold(); }
    if (Date.now() - lastCkpt > 15 * X.MIN) { lastCkpt = Date.now(); makeCkpts(); pushCkpts(); }
  }
  return { init, pushDecisions, guildHTML, raidHTML, arenaHTML, mounted, drawRaid: now => { drawRaid(now); drawDuel(now); drawTavern(Date.now()); }, tavernHTML, footHTML, onClick, tick, creatorHint, heroCreated, version: () => ver,
    mates: () => user ? members.filter(m => m.uid !== user.uid) : [] };
})();

// =====================================================================
// Main loop
// =====================================================================
function rememberSeen() { if (S && !busy) { save.seen = { t: Date.now(), fights: S.fights, wins: S.wins, lvl: S.lvl, gold: S.gold, seed: save.seed }; persist(); } }
function awaySummary(before) {
  if (!before || before.seed !== save.seed || Date.now() - before.t < 30 * X.MIN || S.fights <= before.fights) return;
  const lines = [`${fmt(S.fights - before.fights)} fights, ${fmt(S.wins - before.wins)} won.`];
  if (S.lvl > before.lvl) lines.push(`${S.hero.name} gained ${S.lvl - before.lvl} level${S.lvl - before.lvl === 1 ? "" : "s"}.`);
  lines.push(`${S.gold - before.gold >= 0 ? "+" : ""}${fmt(S.gold - before.gold)} gold.`);
  for (const l of S.log.filter(l => (l[1] === "boss" || l[1] === "loot" || l[1] === "raid") && l[0] > before.t).slice(-4)) lines.push(l[2]);
  const n = openPicks().length; if (n) lines.push(`${n} perk choice${n === 1 ? " is" : "s are"} waiting on the Hero tab.`);
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const t = document.createElement("div"); t.className = "toast";
  t.innerHTML = `<h4>While you were away · ${dur(Date.now() - before.t)}</h4>${lines.map(l => `<p>${esc(l)}</p>`).join("")}<button class="btn">Close</button>`;
  t.querySelector("button").onclick = () => t.remove();
  document.body.appendChild(t);
}
async function startGame() {
  if (running) return;
  running = true;
  const before = save.seen;
  await rebuild();
  $("game").hidden = false;
  awaySummary(before); rememberSeen(); makeCkpts(); render(true);
  const frame = () => {
    if (S && !busy) {
      const now = Date.now(), f = S.fights;
      X.advance(S, now, D, onSnap);
      if (S.fights !== f) render(false);
      drawMap(now); drawBattle(now); Cloud.drawRaid(performance.now());
    }
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
  setInterval(() => { if (S && !busy) { render(false); Cloud.tick(); } }, 1000);
  setInterval(() => { if (S && !busy) makeCkpts(); }, 5 * X.MIN);
  setInterval(() => { if (document.visibilityState === "visible") rememberSeen(); }, 20000);
  document.addEventListener("visibilitychange", async () => {
    if (document.visibilityState === "visible" && S) {
      const pre = save.seen; if (Date.now() - S.t > 30 * X.MIN) { busy = true; await catchUp(S, Date.now()); }
      awaySummary(pre); rememberSeen(); render(true);
    } else if (document.visibilityState === "hidden") { makeCkpts(); rememberSeen(); }
  });
}
window.__wr = { get S() { return S; }, get save() { return save; }, decide, mergeDecisions };
if (save) startGame(); else { openCreator(); previewLoop(); }
Cloud.init().then(() => render(true));
</script>
